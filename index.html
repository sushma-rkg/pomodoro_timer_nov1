<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="split">
    <section class="left">
      <div class="ring">
        <div class="inner">
          <div class="art" role="img" aria-label="Blurred artwork placeholder"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="time" id="time">25:00</div>
      <div class="btns">
        <button class="btn main" id="main-btn" type="button">Start</button>
        <button class="btn" id="reset-btn" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
