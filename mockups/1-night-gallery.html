<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Gallery - mockup</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px;background:#e9e7e2;color:#222;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:18px;margin:36px 0 12px}
p.note{margin:0 0 4px;max-width:640px;line-height:1.5;color:#444}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
figure{margin:0;flex:none}
figcaption{margin-top:8px;font-size:14px;color:#444;text-align:center}
.screen{position:relative;overflow:hidden;flex:none;border:8px solid #111}
.screen.phone{width:300px;height:600px;border-radius:34px}
.screen.laptop{width:640px;height:400px;border-radius:12px}
a{color:inherit}
.art{background:
 radial-gradient(circle at 28% 30%,#f7cf4a 0,transparent 32%),
 radial-gradient(circle at 72% 62%,#e28a1c 0,transparent 38%),
 radial-gradient(circle at 40% 80%,#b9611a 0,transparent 30%),
 linear-gradient(160deg,#3a7f8c,#1a4258 60%,#0f2236)}
.b1 .art{filter:blur(26px);transform:scale(1.25)}
.b2 .art{filter:blur(12px);transform:scale(1.15)}

body.d1 .screen{background:#000;color:#fff}
.d1 .scene{position:absolute;inset:0}
.d1 .art{position:absolute;inset:0}
.d1 .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.d1 .time{font-weight:200;letter-spacing:2px;text-shadow:0 2px 24px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.d1 .phone .time{font-size:78px}
.d1 .laptop .time{font-size:120px}
.d1 .btns{position:absolute;left:0;right:0;bottom:30px;display:flex;gap:12px;justify-content:center}
.d1 .btn{padding:12px 28px;border-radius:999px;font-size:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.d1 .btn.main{background:rgba(255,255,255,.92);color:#111;border-color:transparent}
.d1 .top{position:absolute;top:22px;left:0;right:0;text-align:center}
.d1 .top .time{font-size:38px;font-weight:300}
.d1 .card{position:absolute;background:rgba(10,12,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:20px;text-align:center}
.d1 .phone .card{left:14px;right:14px;bottom:14px}
.d1 .laptop .card{left:50%;transform:translateX(-50%);bottom:20px;width:360px}
.d1 .card h3{margin:0 0 4px;font-size:24px;font-weight:500}
.d1 .card .meta{margin:0 0 8px;color:#c9d0de}
.d1 .card p{margin:0 0 14px}
.d1 .card .link{color:#f2cf6b}
.d1 .card .btn{display:inline-block}
</style>
</head>
<body class="d1">
<h1>Night Gallery</h1>
<p class="note">The painting fills the whole screen. The timer floats in the middle in big thin numbers. Soft glass buttons sit at the bottom.</p>
<p class="note">Design only: buttons do not work and the picture is a coloured placeholder, not a real painting.</p>
<h2>Phone-sized screen</h2>
<div class="row">
<figure><div class="screen phone"><div class="scene b1"><div class="art"></div><div class="center"><span class="time">25:00</span></div><div class="btns"><span class="btn main">Start</span><span class="btn">Reset</span></div></div></div><figcaption>Before starting</figcaption></figure>
<figure><div class="screen phone"><div class="scene b2"><div class="art"></div><div class="center"><span class="time">14:32</span></div><div class="btns"><span class="btn main">Pause</span><span class="btn">Reset</span></div></div></div><figcaption>Timer running</figcaption></figure>
<figure><div class="screen phone"><div class="scene"><div class="art"></div><div class="top"><span class="time">00:00</span></div><div class="card"><h3>Sunflowers</h3><p class="meta">Vincent van Gogh &middot; 1887</p><p><a href="#" class="link">Read about this painting</a></p><span class="btn main">Restart session</span></div></div></div><figcaption>Timer finished</figcaption></figure>
</div>
<h2>Laptop-sized screen</h2>
<div class="row">
<figure><div class="screen laptop"><div class="scene b1"><div class="art"></div><div class="center"><span class="time">25:00</span></div><div class="btns"><span class="btn main">Start</span><span class="btn">Reset</span></div></div></div><figcaption>Before starting</figcaption></figure>
<figure><div class="screen laptop"><div class="scene b2"><div class="art"></div><div class="center"><span class="time">14:32</span></div><div class="btns"><span class="btn main">Pause</span><span class="btn">Reset</span></div></div></div><figcaption>Timer running</figcaption></figure>
<figure><div class="screen laptop"><div class="scene"><div class="art"></div><div class="top"><span class="time">00:00</span></div><div class="card"><h3>Sunflowers</h3><p class="meta">Vincent van Gogh &middot; 1887</p><p><a href="#" class="link">Read about this painting</a></p><span class="btn main">Restart session</span></div></div></div><figcaption>Timer finished</figcaption></figure>
</div>
</body>
</html>
